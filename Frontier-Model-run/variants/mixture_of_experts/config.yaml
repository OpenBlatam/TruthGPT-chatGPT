# Mixture of Experts Transformer Configuration

# Model configuration
model_config:
  vocab_size: 50257
  max_position_embeddings: 8192
  hidden_size: 4096
  num_hidden_layers: 32
  num_attention_heads: 32
  intermediate_size: 16384
  hidden_dropout_prob: 0.1
  attention_dropout_prob: 0.1
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  use_cache: true
  
  # MoE specific parameters
  num_experts: 8
  num_experts_per_token: 2
  expert_capacity_factor: 1.25
  use_expert_choice: false
  expert_dropout: 0.1
  
  # Load balancing
  load_balancing_loss_coef: 0.01
  use_auxiliary_loss: true
  
  # Expert routing
  router_z_loss_coef: 0.001
  router_aux_loss_coef: 0.001
  
  # Hierarchical experts
  use_hierarchical_experts: false
  num_expert_groups: 2
  
  # Expert specialization
  use_expert_specialization: true
  specialization_loss_coef: 0.001
  
  # Advanced features
  use_rotary_embeddings: true
  use_rms_norm: true
  use_pre_norm: true

# Dataset configuration
dataset_name: "wikitext"
dataset_config: "wikitext-103-raw-v1"
dataset_train_split: "train"
dataset_test_split: "validation"
max_length: 2048

# Training parameters
output_dir: "./moe_transformer_output"
num_train_epochs: 3
per_device_train_batch_size: 2  # Smaller due to MoE memory usage
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 3e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# Optimization
optimizer_type: "adamw"
lr_scheduler_type: "cosine"
num_cycles: 1
use_amp: true
fp16: true
bf16: false

# Advanced features
use_gradient_checkpointing: true
use_flash_attention: true
use_compile: false  # May not work with complex MoE routing

# Evaluation and logging
eval_strategy: "steps"
eval_steps: 500
logging_steps: 100
save_steps: 1000
save_total_limit: 3

# Wandb logging
use_wandb: true
wandb_project: "moe-transformer"
wandb_run_name: "moe-transformer-v1"

# Advanced training techniques
use_curriculum_learning: true
use_label_smoothing: true
label_smoothing_factor: 0.1

# Memory optimization
use_cpu_offload: false
use_activation_checkpointing: true