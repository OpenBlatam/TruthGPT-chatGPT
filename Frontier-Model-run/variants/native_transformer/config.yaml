# Native Transformer Configuration

# Model configuration
model_config:
  vocab_size: 50257
  max_position_embeddings: 8192
  hidden_size: 4096
  num_hidden_layers: 32
  num_attention_heads: 32
  intermediate_size: 16384
  hidden_dropout_prob: 0.1
  attention_dropout_prob: 0.1
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  use_cache: true
  
  # Advanced attention features
  use_adaptive_attention: true
  use_sparse_attention: true
  use_rotary_embeddings: true
  use_alibi: false
  attention_window_size: 512
  sparse_attention_ratio: 0.1
  
  # Layer-wise scaling
  use_layer_scale: true
  layer_scale_init: 1e-4
  
  # Advanced normalization
  use_rms_norm: true
  use_pre_norm: true

# Dataset configuration
dataset_name: "wikitext"
dataset_config: "wikitext-103-raw-v1"
dataset_train_split: "train"
dataset_test_split: "validation"
max_length: 2048

# Training parameters
output_dir: "./native_transformer_output"
num_train_epochs: 3
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# Optimization
optimizer_type: "adamw"
lr_scheduler_type: "cosine"
num_cycles: 1
use_amp: true
fp16: true
bf16: false

# Advanced features
use_gradient_checkpointing: true
use_flash_attention: true
use_compile: true

# Evaluation and logging
eval_strategy: "steps"
eval_steps: 500
logging_steps: 100
save_steps: 1000
save_total_limit: 3

# Distributed training
local_rank: -1

# Wandb logging
use_wandb: true
wandb_project: "native-transformer"
wandb_run_name: "native-transformer-v1"

# Advanced training techniques
use_curriculum_learning: true
use_label_smoothing: true
label_smoothing_factor: 0.1
use_mixup: false
mixup_alpha: 0.2

# Memory optimization
use_cpu_offload: false
use_activation_checkpointing: true

# Model specific features
use_adaptive_attention: true
use_sparse_attention: true
use_rotary_embeddings: true
attention_window_size: 512
sparse_attention_ratio: 0.1