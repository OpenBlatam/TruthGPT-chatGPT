# Multi-Modal Transformer Configuration

# Model configuration
model_config:
  vocab_size: 50257
  max_position_embeddings: 8192
  hidden_size: 4096
  num_hidden_layers: 32
  num_attention_heads: 32
  intermediate_size: 16384
  hidden_dropout_prob: 0.1
  attention_dropout_prob: 0.1
  layer_norm_eps: 1e-5
  initializer_range: 0.02
  use_cache: true
  
  # Multi-modal parameters
  modalities: ["text", "vision", "audio"]
  
  # Vision parameters
  vision_encoder_type: "resnet"  # "resnet", "vit", "clip"
  image_size: 224
  vision_hidden_size: 2048
  num_vision_tokens: 196  # 14x14 for ViT
  vision_patch_size: 16
  
  # Audio parameters
  audio_encoder_type: "mel_spectrogram"  # "wav2vec", "mel_spectrogram"
  audio_sample_rate: 16000
  audio_hidden_size: 768
  num_audio_tokens: 100
  mel_bins: 80
  
  # Cross-modal fusion
  use_cross_modal_attention: true
  cross_modal_layers: [8, 16, 24]  # Which layers to apply cross-modal attention
  fusion_method: "attention"  # "attention", "concat", "gating"
  
  # Unified embedding space
  use_unified_embedding: true
  unified_embedding_dim: 4096
  
  # Modality-specific parameters
  use_modality_embeddings: true
  use_modality_specific_layers: false
  
  # Advanced features
  use_rotary_embeddings: true
  use_rms_norm: true
  use_pre_norm: true

# Dataset configuration
dataset_name: "conceptual_captions"  # Multi-modal dataset
dataset_config: null
dataset_train_split: "train"
dataset_test_split: "validation"
max_length: 2048

# Training parameters
output_dir: "./multimodal_transformer_output"
num_train_epochs: 3
per_device_train_batch_size: 1  # Very small due to multi-modal memory usage
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 2e-5
weight_decay: 0.01
warmup_ratio: 0.1
max_grad_norm: 1.0

# Optimization
optimizer_type: "adamw"
lr_scheduler_type: "cosine"
num_cycles: 1
use_amp: true
fp16: true
bf16: false

# Advanced features
use_gradient_checkpointing: true
use_flash_attention: true
use_compile: false  # May not work with multi-modal components

# Evaluation and logging
eval_strategy: "steps"
eval_steps: 1000
logging_steps: 100
save_steps: 2000
save_total_limit: 3

# Wandb logging
use_wandb: true
wandb_project: "multimodal-transformer"
wandb_run_name: "multimodal-transformer-v1"

# Advanced training techniques
use_curriculum_learning: true
use_label_smoothing: true
label_smoothing_factor: 0.1

# Memory optimization
use_cpu_offload: true  # Needed for multi-modal
use_activation_checkpointing: true